<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 370" role="img" aria-labelledby="title"><title id="title">絕對值不等式解題圖</title><rect width="330" height="370" rx="12" fill="#173c34"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="165" y="34" fill="#f5d68b" text-anchor="middle" font-size="20">絕對值不等式｜第1份</text><text x="165" y="85" fill="#f2f6e9" text-anchor="middle" font-size="23">|4x−3| ≤ 9</text><text x="165" y="125" fill="#f2f6e9" text-anchor="middle" font-size="21">−9 ≤ 4x−3 ≤ 9</text><text x="165" y="170" fill="#f5d68b" text-anchor="middle" font-size="25">−3/2 ≤ x ≤ 3</text><line x1="25" y1="235" x2="305" y2="235" stroke="#87a99f" stroke-width="2"/><line x1="89.5" y1="235" x2="238" y2="235" stroke="#b8e6cb" stroke-width="5"/><circle cx="89.5" cy="235" r="5" fill="#f5d68b" stroke="#f5d68b" stroke-width="2"/><circle cx="238" cy="235" r="5" fill="#f5d68b" stroke="#f5d68b" stroke-width="2"/><text x="89.5" y="270" fill="#f2f6e9" text-anchor="middle" font-size="17">−3/2</text><text x="238" y="270" fill="#f2f6e9" text-anchor="middle" font-size="17">3</text></g></svg>