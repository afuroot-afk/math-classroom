<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 350" role="img" aria-labelledby="title"><title id="title">分母有理化解題圖</title><rect width="330" height="350" rx="12" fill="#173c34"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="165" y="24" fill="#b8e6cb" text-anchor="middle" font-size="20">分母有理化</text><text x="165" y="86" fill="#f2f6e9" text-anchor="middle" font-size="21">③ 原式＝(√3−√2)＋(2−√3)</text><line x1="165" y1="100" x2="165" y2="124" stroke="#a3d9ed" stroke-width="2"/><text x="165" y="150" fill="#f2f6e9" text-anchor="middle" font-size="21">＋√3 與 −√3 抵消</text><line x1="165" y1="164" x2="165" y2="188" stroke="#a3d9ed" stroke-width="2"/><text x="165" y="214" fill="#f2f6e9" text-anchor="middle" font-size="21">剩下 2−√2</text><line x1="165" y1="228" x2="165" y2="252" stroke="#a3d9ed" stroke-width="2"/><text x="165" y="278" fill="#f5d68b" text-anchor="middle" font-size="21">答：2−√2</text></g></svg>