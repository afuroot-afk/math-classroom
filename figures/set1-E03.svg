<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 370" role="img" aria-labelledby="title"><title id="title">多項式次數解題圖</title><rect width="330" height="370" rx="12" fill="#173c34"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="165" y="34" fill="#f5d68b" text-anchor="middle" font-size="20">多項式次數｜第1份</text><rect x="14" y="50" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="75" fill="#f2f6e9" text-anchor="middle" font-size="17">y⁴ → 4 次</text><rect x="14" y="122" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="147" fill="#f2f6e9" text-anchor="middle" font-size="17">2 → 沒有字母，0 次</text><rect x="14" y="194" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="219" fill="#f2f6e9" text-anchor="middle" font-size="17">最高是 5 次 ⇒ 次數＝5</text><rect x="14" y="266" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="291" fill="#f5d68b" text-anchor="middle" font-size="17">答：(D) 5</text></g></svg>