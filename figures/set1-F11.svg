<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 370" role="img" aria-labelledby="title"><title id="title">兩根求方程式解題圖</title><rect width="330" height="370" rx="12" fill="#173c34"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="165" y="34" fill="#f5d68b" text-anchor="middle" font-size="20">兩根求方程式｜第1份</text><rect x="14" y="50" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="75" fill="#f2f6e9" text-anchor="middle" font-size="16.764705882352942">展開：x²－(α＋β)x＋αβ＝0</text><rect x="14" y="122" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="138" fill="#f2f6e9" text-anchor="middle" font-size="13.571428571428571">(B)(D) 是 ＋8x，等於和變 －8 </text><text x="165" y="156" fill="#f2f6e9" text-anchor="middle" font-size="17">✗</text><rect x="14" y="194" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="219" fill="#f2f6e9" text-anchor="middle" font-size="14.25">(C) 是 －13，等於積變 －13 ✗</text><rect x="14" y="266" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="291" fill="#f5d68b" text-anchor="middle" font-size="17">答：(A)</text></g></svg>