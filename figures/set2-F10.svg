<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 350" role="img" aria-labelledby="title"><title id="title">公式解解題圖</title><rect width="330" height="350" rx="12" fill="#173c34"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="165" y="24" fill="#b8e6cb" text-anchor="middle" font-size="20">公式解</text><text x="165" y="86" fill="#f2f6e9" text-anchor="middle" font-size="14.830508474576272" textLength="312" lengthAdjust="spacingAndGlyphs">③ 兩根：(4＋√(10))÷(2)、(4−√(10))÷(2)</text><line x1="165" y1="100" x2="165" y2="124" stroke="#a3d9ed" stroke-width="2"/><text x="165" y="150" fill="#f2f6e9" text-anchor="middle" font-size="20.6337509211496" textLength="312" lengthAdjust="spacingAndGlyphs">檢查和：(4＋√10＋4−√10)÷(2)＝4</text><line x1="165" y1="164" x2="165" y2="188" stroke="#a3d9ed" stroke-width="2"/><text x="165" y="214" fill="#f2f6e9" text-anchor="middle" font-size="20.6337509211496" textLength="312" lengthAdjust="spacingAndGlyphs">檢查積：(16−10)÷(4)＝(3)÷(2)</text><line x1="165" y1="228" x2="165" y2="252" stroke="#a3d9ed" stroke-width="2"/><text x="165" y="278" fill="#f5d68b" text-anchor="middle" font-size="21">答：x＝(4±√(10))÷(2)</text></g></svg>