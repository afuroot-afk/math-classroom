<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 370" role="img" aria-labelledby="title"><title id="title">集合表示法解題圖</title><rect width="330" height="370" rx="12" fill="#173c34"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="165" y="34" fill="#f5d68b" text-anchor="middle" font-size="20">集合表示法｜第1份</text><rect x="14" y="50" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="66" fill="#f2f6e9" text-anchor="middle" font-size="13.571428571428571">右邊＝｛10,100,1000,10000</text><text x="165" y="84" fill="#f2f6e9" text-anchor="middle" font-size="17">,⋯｝</text><rect x="14" y="122" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="147" fill="#f2f6e9" text-anchor="middle" font-size="17">③ 和等號左邊的元素一模一樣</text><rect x="14" y="194" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="219" fill="#f2f6e9" text-anchor="middle" font-size="17">兩個集合元素完全相同 ⇒ 相等</text><rect x="14" y="266" width="302" height="61" rx="7" fill="none" stroke="#87a99f"/><text x="165" y="291" fill="#f5d68b" text-anchor="middle" font-size="17">答：T（對）</text></g></svg>